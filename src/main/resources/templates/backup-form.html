<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>백업 수정 — MoveGuard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app">
<aside th:replace="~{fragments/shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
    <header th:replace="~{fragments/shell :: topbar('백업 수정')}"></header>
    <main class="content">
    <p><a th:href="@{'/projects/' + ${projectId}}">← 사업 상세</a></p>
    <h1>백업 수정</h1>

    <div class="errors" th:if="${errors}">
        <h2>저장되지 않았습니다</h2>
        <ul><li th:each="e : ${errors}" th:text="${e}">오류</li></ul>
    </div>

    <form th:action="@{'/projects/' + ${projectId} + '/backups/' + ${backup.backupId} + '/edit'}"
          method="post" class="form">
        <p><label>자산<br>
            <select name="assetId">
                <option th:each="a : ${assets}" th:value="${a.assetId}" th:text="${a.name}"
                        th:selected="${a.assetId == backup.assetId}">db01</option>
            </select></label></p>
        <p><label>마지막 백업일<br><input type="date" name="lastBackupAt" th:value="${backup.lastBackupAt}"></label></p>
        <p><label class="chk"><input type="checkbox" name="restoreTested" value="true"
                                     th:checked="${backup.restoreTested}"> 복구 테스트 수행</label></p>
        <p><label class="chk"><input type="checkbox" name="offsite" value="true"
                                     th:checked="${backup.offsite}"> 오프사이트 보관</label></p>
        <p><label>단계<br>
            <select name="phase">
                <option value="BEFORE" th:selected="${backup.phase == 'BEFORE'}">BEFORE</option>
                <option value="AFTER" th:selected="${backup.phase == 'AFTER'}">AFTER</option>
            </select></label></p>
        <p><button class="btn" type="submit">저장</button></p>
    </form>
</main>
</div>
</body>
</html>
