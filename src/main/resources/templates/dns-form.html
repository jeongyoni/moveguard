<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DNS 수정 — MoveGuard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app">
<aside th:replace="~{fragments/shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
    <header th:replace="~{fragments/shell :: topbar('DNS 수정')}"></header>
    <main class="content">
    <p class="crumb"><a th:href="@{'/projects/' + ${projectId}}">← 환경 상세</a></p>
    <h1>DNS 수정</h1>

    <div class="errors" th:if="${errors}">
        <h2>저장되지 않았습니다</h2>
        <ul>
            <li th:each="e : ${errors}" th:text="${e}">오류</li>
        </ul>
    </div>

    <form th:action="@{'/projects/' + ${projectId} + '/dns/' + ${dns.dnsId} + '/edit'}"
          method="post" class="form">
        <p><label>도메인 *<br><input type="text" name="domain" th:value="${dns.domain}" required></label></p>
        <p><label>레코드 종류<br>
            <select name="recordType">
                <option th:each="t : ${ {'A','AAAA','CNAME','MX','TXT'} }" th:value="${t}" th:text="${t}"
                        th:selected="${t == dns.recordType}">A</option>
            </select></label></p>
        <p><label>값 *<br><input type="text" name="value" th:value="${dns.value}" required></label></p>
        <p><label>TTL<br><input type="number" name="ttl" th:value="${dns.ttl}" min="0"></label></p>
        <p><label>단계<br>
            <select name="phase">
                <option value="BEFORE" th:selected="${dns.phase == 'BEFORE'}">BEFORE</option>
                <option value="AFTER" th:selected="${dns.phase == 'AFTER'}">AFTER</option>
            </select></label></p>
        <p><button class="btn" type="submit">저장</button></p>
    </form>
</main>
</div>
</body>
</html>
