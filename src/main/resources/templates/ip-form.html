<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IP 수정 — MoveGuard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app">
<aside th:replace="~{fragments/shell :: sidebar('dashboard')}"></aside>
<div class="app-main">
    <header th:replace="~{fragments/shell :: topbar('IP 수정')}"></header>
    <main class="content">
    <p><a th:href="@{'/projects/' + ${projectId}}">← 사업 상세</a></p>
    <h1>IP 수정</h1>

    <div class="errors" th:if="${errors}">
        <h2>저장되지 않았습니다</h2>
        <ul>
            <li th:each="e : ${errors}" th:text="${e}">오류</li>
        </ul>
    </div>

    <form th:action="@{'/projects/' + ${projectId} + '/ips/' + ${ip.ipId} + '/edit'}"
          method="post" class="form">
        <p><label>자산<br>
            <select name="assetId">
                <option th:each="a : ${assets}" th:value="${a.assetId}" th:text="${a.name}"
                        th:selected="${a.assetId == ip.assetId}">web01</option>
            </select></label></p>
        <p><label>주소 *<br><input type="text" name="address" th:value="${ip.address}" required></label></p>
        <p><label>종류 (자동 판별)<br>
            <input type="text" th:value="${ip.ipType}" readonly></label>
            <span class="hint">주소를 저장하면 공인/사설이 자동으로 다시 판별됩니다.</span></p>
        <p><label>단계<br>
            <select name="phase">
                <option value="BEFORE" th:selected="${ip.phase == 'BEFORE'}">BEFORE</option>
                <option value="AFTER" th:selected="${ip.phase == 'AFTER'}">AFTER</option>
            </select></label></p>
        <p><label class="chk"><input type="checkbox" name="extWhitelisted" value="true"
                                     th:checked="${ip.extWhitelisted}"> 외부 기관 등록</label></p>
        <p><label>비고<br><input type="text" name="note" th:value="${ip.note}"></label></p>
        <p><button class="btn" type="submit">저장</button></p>
    </form>
</main>
</div>
</body>
</html>
