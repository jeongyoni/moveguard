spring:
  application:
    name: moveguard
  profiles:
    active: local
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

compat:
  endoflife:
    base-url: https://endoflife.date/api
